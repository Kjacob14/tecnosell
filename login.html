<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Tienda Electrónica</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/estilos.css">
    <script src="assets/js/tema.js"></script>
</head>

<body class="bg-body-tertiary">

    <div class="controles-accesibilidad">
        <button type="button" class="navbar-flotante__icono" data-accion="alternar-tema" title="Cambiar tema" aria-label="Cambiar tema">
            <i class="bi bi-sun"></i>
        </button>
        <button type="button" class="navbar-flotante__icono" data-accion="tamano-texto" title="Tamaño de texto" aria-label="Tamaño de texto">
            <i class="bi bi-type"></i>
        </button>
    </div>

    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-12 col-sm-8 col-md-6 col-lg-4">

                <div class="card shadow-sm">
                    <a href="index.html" class="acceso-volver" title="Volver a la tienda" aria-label="Volver a la tienda">
                        <i class="bi bi-arrow-left"></i>
                    </a>
                    <div class="card-body p-4">

                        <h1 class="h4 text-center mb-4">Iniciar sesión</h1>
                        <div id="alertaLogin" class="alert alert-danger d-none" role="alert"></div>

                        <form id="formLogin" novalidate method="dialog" autocomplete="on">

                            <div class="mb-3">
                                <label for="email" class="form-label">Correo electrónico</label>
                                <input type="email" class="form-control" id="email" name="email" autocomplete="username"
                                    required>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">Contraseña</label>
                                <input type="password" class="form-control" id="password" name="password"
                                    autocomplete="current-password" required>
                            </div>

                            <button type="submit" id="btnLogin" class="btn btn-primary w-100">
                                <span id="spinnerLogin" class="spinner-border spinner-border-sm d-none" role="status"
                                    aria-hidden="true"></span>
                                Iniciar sesión
                            </button>

                        </form>

                        <div class="text-center mt-4">
                            <span class="text-muted small d-block mb-2">¿No tienes cuenta?</span>
                            <a href="registro.html" class="btn btn-outline-secondary w-100">Crear cuenta</a>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/login.js"></script>
</body>

</html>
